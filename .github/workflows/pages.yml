name: Build and deploy booklet

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.18"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            build.py
            test-build.py
            test-learner-workspace.py
      - name: Ensure safe test cleanup is available
        run: |
          if ! command -v gio; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libglib2.0-bin
          fi
      - name: Check build and packaging
        run: uv run test-build.py
      - name: Build publication artifact from sources
        run: uv run build.py --site
      - name: Check learner workspace in the generated artifact
        run: uv run test-learner-workspace.py --html _site/index.html
      - name: Upload only the publication artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    # Pull requests and manual runs on other branches only build and test.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
